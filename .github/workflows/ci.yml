name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: regsys_ci_backup_password
          POSTGRES_DB: regsys_test
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RS_DATABASE_URL: postgresql+psycopg://postgres:regsys_ci_backup_password@127.0.0.1:15432/regsys_test
      RS_PG_BIN_DIR: /usr/lib/postgresql/16/bin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install PostgreSQL 16 client tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y postgresql-client-16
          "$RS_PG_BIN_DIR/pg_dump" --version
          "$RS_PG_BIN_DIR/pg_restore" --version
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - run: pytest -q

  client:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm exec -- tsc --noEmit
      - run: npm run build
