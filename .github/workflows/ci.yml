name: CI

on:
  push:
    branches: [main, codex/devops-operations]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: regsys_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RS_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/regsys_test
      RS_PG_BIN_DIR: /usr/lib/postgresql/16/bin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client-16
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build

  agent:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agent/pyproject.toml
      - run: python -m pip install -e ".[dev]" ruff mypy
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy regsys_agent
      - run: python -m pytest -q

  operations:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff
      - run: python -m ruff check scripts/configure_env.py scripts/smoke.py scripts/tests
      - run: python -m ruff format --check scripts/configure_env.py scripts/smoke.py scripts/tests
      - run: python -m unittest discover -s scripts/tests -v
      - run: python scripts/configure_env.py
      - run: docker compose --profile ops config --quiet
      - run: docker compose build api web
      - run: docker compose run --rm --no-deps web caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - run: docker compose up -d --wait --wait-timeout 120
      - run: python scripts/smoke.py
      - name: Create and verify a backup on the real PostgreSQL container
        run: |
          docker compose --profile ops run --rm backups python scripts/backup.py now
          docker compose --profile ops run --rm backups python scripts/backup.py verify
      - name: Check that container recreation preserves participant photos
        run: |
          docker compose exec -T api python -c "from pathlib import Path; Path('/srv/.data/photos/ci-check.txt').write_text('persistent')"
          docker compose up -d --force-recreate --wait api
          docker compose exec -T api python -c "from pathlib import Path; assert Path('/srv/.data/photos/ci-check.txt').read_text() == 'persistent'"
          python scripts/smoke.py
      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p ci-logs
          docker compose ps --all > ci-logs/compose-ps.txt
          docker compose logs --no-color > ci-logs/compose.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: compose-diagnostics
          path: ci-logs
          retention-days: 7
      - name: Stop disposable CI containers
        if: always()
        run: docker compose --profile ops down --volumes
