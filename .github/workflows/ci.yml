name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: regsys_ci_backup_password
          POSTGRES_DB: regsys_test
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RS_DATABASE_URL: postgresql+psycopg://postgres:regsys_ci_backup_password@127.0.0.1:15432/regsys_test
      RS_PG_BIN_DIR: /usr/lib/postgresql/16/bin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install PostgreSQL 16 client tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y postgresql-client-16
          "$RS_PG_BIN_DIR/pg_dump" --version
          "$RS_PG_BIN_DIR/pg_restore" --version
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - run: pytest -q

  client:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm exec -- tsc --noEmit
      - run: npm run build

  agent:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/pyproject.toml
      - run: pip install -e ".[dev]" pyinstaller
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy regsys_agent
      - run: python -m pytest -q
      - name: Собрать regsys-agent.exe
        run: python -m PyInstaller --noconfirm --onefile --name regsys-agent --console regsys_agent/__main__.py
      - name: Проверить запуск EXE
        run: .\dist\regsys-agent.exe --help
      - uses: actions/upload-artifact@v4
        with:
          name: regsys-agent-windows
          path: agent/dist/regsys-agent.exe
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-24.04
    env:
      POSTGRES_PASSWORD: deploy_ci_only_password
      RS_SECRET_KEY: deploy_ci_only_secret
      RS_PUBLIC_HOST: regsys-ci.example.test
    steps:
      - uses: actions/checkout@v4
      - name: Проверить production compose
        run: docker compose -f docker-compose.prod.yml config --quiet
      - name: Собрать образ edge
        run: docker compose -f docker-compose.prod.yml build edge
      - name: Проверить Caddyfile без предупреждений
        run: |
          set -o pipefail
          out=$(docker compose -f docker-compose.prod.yml run --rm --no-deps edge \
            validate --config /etc/caddy/Caddyfile --adapter caddyfile 2>&1) || {
            echo "$out"; exit 1; }
          echo "$out"
          grep -q 'Valid configuration' <<<"$out"
          if grep -q 'No files matching import glob pattern' <<<"$out"; then
            echo 'Caddy: пустой glob kiosks/sites/*.caddy'; exit 1
          fi

  backup-delivery:
    runs-on: ubuntu-24.04
    env:
      COMPOSE_FILE: docker-compose.prod.yml:docker-compose.backup-mirror.yml
      COMPOSE_PROJECT_NAME: regsys-backup-ci
      POSTGRES_PASSWORD: regsys_backup_compose_ci_only
      RS_SECRET_KEY: regsys-backup-compose-ci-only
      RS_PUBLIC_HOST: regsys-backup-ci.localhost
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the backup service
        run: |
          export RS_BACKUP_MIRROR_HOST_DIR="$RUNNER_TEMP/regsys-backup-mirror"
          printf 'RS_BACKUP_MIRROR_HOST_DIR=%s\n' "$RS_BACKUP_MIRROR_HOST_DIR" >> "$GITHUB_ENV"
          sudo install -d -m 0700 -o 1000 -g 1000 "$RS_BACKUP_MIRROR_HOST_DIR"
          docker compose config --quiet
          docker compose build api backup
          docker compose up -d --wait db
          docker compose run --rm --no-deps api python -m app.cli migrate
          docker compose run --rm --no-deps -T backup python - seed < deploy/tests/backup_delivery_smoke.py
          docker compose up -d --wait backup
      - name: Restore database and photos from the mirror
        run: docker compose exec -T backup python - verify < deploy/tests/backup_delivery_smoke.py
      - name: Clean up the disposable CI project
        if: always()
        run: |
          export RS_BACKUP_MIRROR_HOST_DIR="${RS_BACKUP_MIRROR_HOST_DIR:-$RUNNER_TEMP/regsys-backup-mirror}"
          docker compose logs --no-color backup || true
          docker compose down --volumes
