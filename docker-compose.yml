services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: regsys
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-regsys}
      POSTGRES_DB: regsys
      # В официальном образе (Debian) из UTF-8 локалей есть только C.UTF-8 и en_US.UTF-8;
      # ru_RU.UTF-8 без доп. пакетов нет. C.UTF-8 даёт кодировку UTF-8, lower() для
      # кириллицы работает, а поиск мы всё равно ведём по нормализованной колонке search_norm.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U regsys -d regsys"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      RS_ENV: ${RS_ENV:-dev}
      RS_DATABASE_URL: postgresql+psycopg://regsys:${POSTGRES_PASSWORD:-regsys}@db:5432/regsys
      RS_SECRET_KEY: ${RS_SECRET_KEY:-dev-secret-change-me}
      RS_CORS_ORIGINS: ${RS_CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
